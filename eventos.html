<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<nav class="navbar navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand" href="index.html">Portal Comunitário</a>
</div>
</nav>
</header>

<main class="container mt-4">

<h1>Eventos</h1>

<input
type="text"
id="pesquisa"
class="form-control"
placeholder="Pesquisar evento">

<div class="eventos-grid mt-4">

<article class="card-evento">
<h2>Feira do Livro</h2>
<p>Evento cultural.</p>

<button
class="btn btn-warning favorito"
data-evento="Feira do Livro">
Favoritar
</button>
</article>

<article class="card-evento">
<h2>Oficina de Informática</h2>
<p>Curso gratuito.</p>

<button
class="btn btn-warning favorito"
data-evento="Oficina de Informática">
Favoritar
</button>
</article>

<article class="card-evento">
<h2>Caminhada Comunitária</h2>
<p>Evento esportivo.</p>

<button
class="btn btn-warning favorito"
data-evento="Caminhada Comunitária">
Favoritar
</button>
</article>

</div>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
